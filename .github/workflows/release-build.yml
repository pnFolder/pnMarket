name: Release Build

on:
  push:
    branches:
      - feature/chat-favorites
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build

      - name: Prepare release artifact
        run: cp build/libs/pnMarket-1.1.0.jar pnMarket-1.1.0-paper-mc1.16.5-java17.jar

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pnMarket-1.1.0-paper-mc1.16.5-java17
          path: pnMarket-1.1.0-paper-mc1.16.5-java17.jar
          if-no-files-found: error

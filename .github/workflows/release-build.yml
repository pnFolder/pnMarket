name: Release Build

on:
  push:
    branches:
      - feature/chat-favorites
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pnMarket
        uses: actions/checkout@v4

      - name: Checkout pnLibrary
        run: git clone --depth=1 https://github.com/pnFolder/pnLibrary.git ../pnLibrary

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build

      - name: Prepare release artifact
        run: cp build/libs/pnMarket-1.1.0.jar pnMarket-1.1.0-paper-mc1.16.5-java17.jar

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pnMarket-1.1.0-paper-mc1.16.5-java17
          path: pnMarket-1.1.0-paper-mc1.16.5-java17.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "Release v1.1.0 already exists; skipping publication."
            exit 0
          fi
          gh release create v1.1.0 \
            pnMarket-1.1.0-paper-mc1.16.5-java17.jar \
            --repo pnFolder/pnMarket \
            --target "$GITHUB_SHA" \
            --title "v1.1.0 - Добавлено избранное через чат" \
            --notes-file RELEASE-1.1.0.md
